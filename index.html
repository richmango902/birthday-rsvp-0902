<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>9월 2일, 생일잔치에 초대합니다</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: 'SUIT Variable';
    font-weight: 100 900;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/variable/woff2/SUIT-Variable.woff2') format('woff2-variations');
  }

  :root {
    --bg-a: #ffe1ef;
    --bg-b: #eee2ff;
    --bg-c: #dcf9ee;
    --card: #fffcf8;
    --ink: #4a3b52;
    --muted: #9c8aa8;
    --pink: #ff7fb4;
    --pink-deep: #e85f9a;
    --lavender: #b39cf2;
    --mint: #57d6b4;
    --yellow: #ffcf4d;
    --peach: #ffb199;
    --rose: #e2557a;
    --sans: 'SUIT Variable', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.25rem, 5vw, 3.5rem) 1rem;
    position: relative;
    overflow-x: hidden;
    background: linear-gradient(150deg, var(--bg-a) 0%, var(--bg-b) 52%, var(--bg-c) 100%);
  }

  .dust {
    position: fixed; inset: 0; z-index: 0; opacity: 0.55;
    background-image:
      radial-gradient(circle, rgba(255, 127, 180, 0.35) 3px, transparent 3.5px),
      radial-gradient(circle, rgba(87, 214, 180, 0.3) 3px, transparent 3.5px),
      radial-gradient(circle, rgba(255, 207, 77, 0.35) 2.5px, transparent 3px),
      radial-gradient(circle, rgba(179, 156, 242, 0.3) 2.5px, transparent 3px);
    background-size: 160px 160px, 190px 190px, 140px 140px, 210px 210px;
    background-position: 10px 20px, 90px 140px, 40px 190px, 150px 30px;
  }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(46px); z-index: 0;
    animation: drift 15s ease-in-out 3;
  }
  .blob.one { width: 280px; height: 280px; top: 6%; left: -70px; background: radial-gradient(circle, rgba(255,127,180,0.45), transparent 70%); }
  .blob.two { width: 240px; height: 240px; bottom: 5%; right: -60px; background: radial-gradient(circle, rgba(87,214,180,0.4), transparent 70%); animation-delay: -5s; }
  .blob.three { width: 200px; height: 200px; top: 45%; right: 4%; background: radial-gradient(circle, rgba(255,207,77,0.35), transparent 70%); animation-delay: -9s; }

  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.06); }
  }

  .balloon {
    position: fixed;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    z-index: 0;
    animation: bob 6s ease-in-out 4;
  }
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -46px;
    width: 1px;
    height: 46px;
    background: rgba(74, 59, 82, 0.25);
  }
  .balloon.a { width: 46px; height: 58px; top: 10%; left: 8%; background: var(--pink); animation-delay: -1s; }
  .balloon.b { width: 36px; height: 46px; top: 20%; right: 10%; background: var(--mint); animation-delay: -3s; }
  .balloon.c { width: 30px; height: 38px; bottom: 16%; left: 12%; background: var(--yellow); animation-delay: -4.5s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  main {
    position: relative; z-index: 1; width: 100%; max-width: 460px;
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    color: var(--ink);
    border: 3px dashed var(--pink);
    border-radius: 28px;
    padding: clamp(1.75rem, 6vw, 3rem) clamp(1.5rem, 6vw, 2.75rem);
    box-shadow: 0 24px 60px -20px rgba(232, 95, 154, 0.35);
  }

  .eyebrow {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--pink-deep); text-align: center; margin: 0 0 0.9rem;
  }
  h1 {
    font-family: var(--sans); font-weight: 800; font-style: normal;
    text-align: center; font-size: clamp(1.8rem, 6vw, 2.5rem);
    line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance;
    margin: 0 0 0.6rem; color: var(--ink);
  }
  .sub {
    text-align: center; font-size: 0.95rem; font-weight: 500; line-height: 1.6;
    color: var(--muted); margin: 0 auto 1.6rem; max-width: 32ch;
  }

  .divider { display: flex; align-items: center; gap: 0.6rem; margin: 1.6rem 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--lavender) 0 6px, transparent 6px 12px); }
  .divider span { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); display: block; }

  .details {
    display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1rem;
    font-size: 0.9rem; font-weight: 500; margin-bottom: 1.8rem;
  }
  .details dt {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--pink-deep); padding-top: 0.15rem;
  }
  .details dd { margin: 0; color: var(--ink); line-height: 1.55; }

  form { display: flex; flex-direction: column; gap: 1.15rem; }
  .field-group label.title {
    display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.02em; color: var(--ink); margin-bottom: 0.45rem;
  }

  input[type="text"], textarea {
    width: 100%; font-family: var(--sans); font-size: 0.95rem; font-weight: 500; color: var(--ink);
    background: #fff; border: 2px solid #f2d9e6; border-radius: 14px;
    padding: 0.65rem 0.85rem; outline-offset: 2px;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--pink); }
  textarea { resize: vertical; min-height: 3.2rem; }

  .toggle { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.5rem; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle label {
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0.6rem 0.5rem; border: 2px solid #f2d9e6; border-radius: 14px;
    font-size: 0.88rem; font-weight: 600; cursor: pointer; background: #fff; color: var(--ink);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .toggle input:checked + label {
    background: var(--pink); border-color: var(--pink); color: #fff; transform: translateY(-1px);
  }
  .toggle input:focus-visible + label { outline: 2px solid var(--lavender); outline-offset: 2px; }

  .hint { font-size: 0.78rem; font-weight: 500; color: var(--muted); margin: 0.35rem 0 0; line-height: 1.5; }

  button.submit {
    margin-top: 0.4rem; font-family: var(--sans); font-size: 1rem; font-weight: 800; letter-spacing: 0.01em;
    color: #fff; background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    border: none; border-radius: 16px;
    padding: 0.9rem 1rem; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button.submit:hover { transform: translateY(-1px); }
  button.submit:disabled { opacity: 0.55; cursor: default; transform: none; }
  button.submit:focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }

  .error-msg { font-size: 0.82rem; font-weight: 600; color: var(--rose); margin: -0.3rem 0 0; display: none; }
  .error-msg.show { display: block; }

  .success { display: none; text-align: center; padding: 0.5rem 0 0.25rem; }
  .success.show { display: block; animation: rise 0.5s ease both; }
  .success .mark {
    width: 48px; height: 48px; margin: 0 auto 1rem; border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), #3fc6a0);
    display: flex; align-items: center; justify-content: center;
  }
  .success .mark svg { width: 22px; height: 22px; }
  .success h2 { font-family: var(--sans); font-weight: 800; font-size: 1.4rem; margin: 0 0 0.5rem; color: var(--ink); }
  .success p { color: var(--muted); font-size: 0.92rem; font-weight: 500; line-height: 1.6; margin: 0; }

  form.hide { display: none; }

  @media (prefers-reduced-motion: reduce) {
    main, .success.show, .blob, .balloon { animation: none; }
  }
</style>
</head>
<body>
  <div class="dust"></div>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>
  <div class="balloon a"></div>
  <div class="balloon b"></div>
  <div class="balloon c"></div>

  <main>
    <div class="card">
      <p class="eyebrow">9월 2일 · 생일잔치</p>
      <h1>제 생일에<br>초대하고 싶어요</h1>
      <p class="sub">시간 맞춰 다들 얼굴 보면 좋을 것 같아서요. 아래에 적어주시면 자리 준비할게요.</p>

      <div class="divider"><span></span></div>

      <dl class="details">
        <dt>날짜</dt>
        <dd>2026년 9월 2일 (수요일)</dd>
        <dt>시간</dt>
        <dd>점심 · 11:30 / 12:00 / 12:30 중 편한 시간으로 맞출게요</dd>
        <dt>장소</dt>
        <dd>추후 별도로 안내드릴게요</dd>
      </dl>

      <form id="rsvpForm">
        <div class="field-group">
          <label class="title" for="name">이름</label>
          <input type="text" id="name" name="name" required autocomplete="name" placeholder="누구신가요?">
        </div>

        <div class="field-group">
          <label class="title" id="attendanceLabel">참석 여부</label>
          <div class="toggle" role="radiogroup" aria-labelledby="attendanceLabel">
            <input type="radio" id="att-yes" name="attendance" value="참석" required>
            <label for="att-yes">참석해요</label>
            <input type="radio" id="att-no" name="attendance" value="불참">
            <label for="att-no">아쉽지만 못 가요</label>
          </div>
        </div>

        <div class="field-group">
          <label class="title" id="timeLabel">선호 시간대</label>
          <div class="toggle" role="radiogroup" aria-labelledby="timeLabel">
            <input type="radio" id="time-1130" name="time" value="11:30">
            <label for="time-1130">11:30</label>
            <input type="radio" id="time-1200" name="time" value="12:00">
            <label for="time-1200">12:00</label>
            <input type="radio" id="time-1230" name="time" value="12:30">
            <label for="time-1230">12:30</label>
          </div>
          <p class="hint">더 많은 분들이 편한 시간으로 정할게요.</p>
        </div>

        <div class="field-group">
          <label class="title" for="menu">먹고 싶은 메뉴</label>
          <textarea id="menu" name="menu" placeholder="생각나는 대로 편하게 적어주세요"></textarea>
        </div>

        <p class="error-msg" id="errorMsg">전송 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.</p>

        <button type="submit" class="submit" id="submitBtn">신청 보내기</button>
      </form>

      <div class="success" id="successBox">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 12 9 17 20 6"></polyline>
          </svg>
        </div>
        <h2>신청 완료</h2>
        <p>알려주셔서 고마워요. 9월 2일에 봐요!</p>
      </div>
    </div>
  </main>

  <script>
    // 배포한 Apps Script 웹 앱 URL
    const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwkMjtnuuX-SvJ0agMZAlJgKkUOkr3HtyVyj_7ClFhuUa2BGCx6KGu0eRVIQBB8YAN2gg/exec";

    const form = document.getElementById("rsvpForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successBox = document.getElementById("successBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");

      const data = new FormData(form);
      const payload = {
        name: (data.get("name") || "").toString().trim(),
        attendance: data.get("attendance") || "",
        time: data.get("time") || "",
        menu: (data.get("menu") || "").toString().trim(),
      };

      if (!payload.name || !payload.attendance) {
        errorMsg.textContent = "이름과 참석 여부는 꼭 알려주세요.";
        errorMsg.classList.add("show");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "보내는 중…";

      try {
        await fetch(ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        });

        form.classList.add("hide");
        successBox.classList.add("show");
      } catch (err) {
        errorMsg.textContent = "전송 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.";
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "신청 보내기";
      }
    });
  </script>
</body>
</html>
